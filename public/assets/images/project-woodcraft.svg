<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="woodBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f3ef"/>
      <stop offset="100%" stop-color="#e8e4dc"/>
    </linearGradient>
    <linearGradient id="leatherGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b88358"/>
      <stop offset="60%" stop-color="#935f37"/>
      <stop offset="100%" stop-color="#693d1b"/>
    </linearGradient>
    <linearGradient id="plinthGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ded8cb"/>
      <stop offset="100%" stop-color="#beb5a3"/>
    </linearGradient>
    <filter id="chairShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="25" stdDeviation="20" flood-color="#3c2f25" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Clean Minimalist Background -->
  <rect width="800" height="500" fill="url(#woodBg)"/>

  <!-- Minimal Nav Bar -->
  <text x="60" y="55" fill="#1d1d1f" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="900" letter-spacing="4">WOODCRAFT</text>
  <text x="320" y="55" fill="#6e6d7a" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" letter-spacing="2">COLLECTION</text>
  <text x="440" y="55" fill="#6e6d7a" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" letter-spacing="2">ATELIER</text>
  <text x="540" y="55" fill="#6e6d7a" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" letter-spacing="2">STORY</text>
  <line x1="60" y1="75" x2="740" y2="75" stroke="#ded8cb" stroke-width="1"/>

  <!-- Left Editorial Typography -->
  <text x="60" y="160" fill="#a07855" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" letter-spacing="3">SCANDINAVIAN COLLECTION 2026</text>
  <text x="60" y="215" fill="#201f24" font-family="Georgia, serif" font-size="44" font-weight="700" letter-spacing="-0.5">Timeless</text>
  <text x="60" y="265" fill="#201f24" font-family="Georgia, serif" font-size="44" font-weight="700" letter-spacing="-0.5">Crafted</text>
  <text x="60" y="315" fill="#201f24" font-family="Georgia, serif" font-size="44" font-weight="700" letter-spacing="-0.5">Furniture</text>

  <text x="60" y="365" fill="#666360" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="400">Handcrafted solid walnut frame with premium</text>
  <text x="60" y="388" fill="#666360" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="400">aniline full-grain leather upholstery.</text>

  <rect x="60" y="420" width="150" height="38" rx="4" fill="#201f24"/>
  <text x="135" y="444" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">EXPLORE PIECE →</text>

  <!-- Right Plinth / Pedestal -->
  <g transform="translate(430, 20)">
    <!-- Architectural Plinth -->
    <path d="M 50 360 L 290 360 L 260 410 L 20 410 Z" fill="url(#plinthGrad)"/>
    <path d="M 20 410 L 260 410 L 260 440 L 20 440 Z" fill="#9f9684"/>

    <!-- Designer Armchair Illustration -->
    <g filter="url(#chairShadow)">
      <!-- Backrest Shell -->
      <path d="M 85 140 Q 155 120 225 140 Q 245 220 220 270 Q 155 280 90 270 Q 65 220 85 140 Z" fill="url(#leatherGrad)"/>
      
      <!-- Backrest inner cushion stitches -->
      <path d="M 115 155 Q 155 140 195 155 Q 205 210 190 245 Q 155 255 120 245 Z" fill="#a46d43" opacity="0.6"/>
      <line x1="155" y1="145" x2="155" y2="250" stroke="#5d3314" stroke-width="2" stroke-dasharray="4 3"/>

      <!-- Seat Cushion -->
      <path d="M 75 250 Q 155 240 235 250 Q 245 290 225 305 Q 155 315 85 305 Q 65 290 75 250 Z" fill="url(#leatherGrad)"/>
      <ellipse cx="155" cy="275" rx="65" ry="22" fill="#885229" opacity="0.4"/>

      <!-- Lumbar Pillow -->
      <ellipse cx="155" cy="245" rx="42" ry="18" fill="#754320"/>

      <!-- Wooden Legs (Mid-century splayed legs) -->
      <!-- Back left -->
      <line x1="95" y1="295" x2="70" y2="370" stroke="#362215" stroke-width="7" stroke-linecap="round"/>
      <!-- Back right -->
      <line x1="215" y1="295" x2="240" y2="370" stroke="#362215" stroke-width="7" stroke-linecap="round"/>
      <!-- Front left -->
      <line x1="110" y1="305" x2="95" y2="380" stroke="#4a2e1d" stroke-width="8" stroke-linecap="round"/>
      <!-- Front right -->
      <line x1="200" y1="305" x2="215" y2="380" stroke="#4a2e1d" stroke-width="8" stroke-linecap="round"/>
      
      <!-- Brass Ferrules on legs -->
      <line x1="73" y1="360" x2="70" y2="370" stroke="#d4af37" stroke-width="7" stroke-linecap="round"/>
      <line x1="237" y1="360" x2="240" y2="370" stroke="#d4af37" stroke-width="7" stroke-linecap="round"/>
      <line x1="97" y1="370" x2="95" y2="380" stroke="#d4af37" stroke-width="8" stroke-linecap="round"/>
      <line x1="213" y1="370" x2="215" y2="380" stroke="#d4af37" stroke-width="8" stroke-linecap="round"/>
    </g>
  </g>
</svg>
