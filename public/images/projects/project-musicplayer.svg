<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="musicBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0d"/>
      <stop offset="100%" stop-color="#151218"/>
    </linearGradient>
    <linearGradient id="spectrumRed" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#73050b"/>
      <stop offset="50%" stop-color="#e50920"/>
      <stop offset="100%" stop-color="#ff4757"/>
    </linearGradient>
    <filter id="musicGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#e50920" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#musicBg)"/>

  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="125" x2="800" y2="125"/>
    <line x1="0" y1="250" x2="800" y2="250"/>
    <line x1="0" y1="375" x2="800" y2="375"/>
    <line x1="266" y1="0" x2="266" y2="500"/>
    <line x1="533" y1="0" x2="533" y2="500"/>
  </g>

  <!-- Left Info -->
  <text x="50" y="55" fill="#e50920" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" letter-spacing="3">AUDIO ENGINEERING &amp; WEB</text>
  <text x="245" y="55" fill="#666675" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" letter-spacing="2">• REAL-TIME VISUALIZER</text>
  <line x1="50" y1="75" x2="750" y2="75" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>

  <text x="50" y="145" fill="#ffffff" font-family="'Bebas Neue', sans-serif" font-size="52" font-weight="900" letter-spacing="2">MUSIC PLAYER</text>
  <text x="50" y="195" fill="#e50920" font-family="'Bebas Neue', sans-serif" font-size="52" font-weight="900" letter-spacing="2">STREAMING &amp; SPECTRUM</text>

  <text x="50" y="240" fill="#8e92a0" font-family="'Plus Jakarta Sans', sans-serif" font-size="13">Modern audio player featuring dynamic frequency spectrum</text>
  <text x="50" y="262" fill="#8e92a0" font-family="'Plus Jakarta Sans', sans-serif" font-size="13">visualization, custom equalizer presets, queue management,</text>
  <text x="50" y="284" fill="#8e92a0" font-family="'Plus Jakarta Sans', sans-serif" font-size="13">and responsive playback controls.</text>

  <g transform="translate(50, 320)">
    <rect x="0" y="0" width="85" height="26" rx="4" fill="#181a22" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="42" y="17" fill="#e4e4e7" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" text-anchor="middle">WEB AUDIO</text>

    <rect x="95" y="0" width="95" height="26" rx="4" fill="#181a22" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="142" y="17" fill="#e4e4e7" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" text-anchor="middle">VISUALIZER</text>

    <rect x="200" y="0" width="75" height="26" rx="4" fill="#181a22" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="237" y="17" fill="#e4e4e7" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" text-anchor="middle">UI / UX</text>
  </g>

  <!-- Right Visual: Music Player Card -->
  <g transform="translate(430, 105)" filter="url(#musicGlow)">
    <rect x="0" y="0" width="330" height="330" rx="16" fill="#111218" stroke="#e50920" stroke-opacity="0.4" stroke-width="1.5"/>

    <!-- Equalizer Spectrum Bars -->
    <g transform="translate(35, 30)">
      <rect x="0" y="60" width="10" height="60" rx="4" fill="url(#spectrumRed)"/>
      <rect x="18" y="40" width="10" height="80" rx="4" fill="url(#spectrumRed)"/>
      <rect x="36" y="20" width="10" height="100" rx="4" fill="url(#spectrumRed)"/>
      <rect x="54" y="50" width="10" height="70" rx="4" fill="url(#spectrumRed)"/>
      <rect x="72" y="15" width="10" height="105" rx="4" fill="url(#spectrumRed)"/>
      <rect x="90" y="30" width="10" height="90" rx="4" fill="url(#spectrumRed)"/>
      <rect x="108" y="70" width="10" height="50" rx="4" fill="url(#spectrumRed)"/>
      <rect x="126" y="25" width="10" height="95" rx="4" fill="url(#spectrumRed)"/>
      <rect x="144" y="10" width="10" height="110" rx="4" fill="url(#spectrumRed)"/>
      <rect x="162" y="45" width="10" height="75" rx="4" fill="url(#spectrumRed)"/>
      <rect x="180" y="30" width="10" height="90" rx="4" fill="url(#spectrumRed)"/>
      <rect x="198" y="60" width="10" height="60" rx="4" fill="url(#spectrumRed)"/>
      <rect x="216" y="20" width="10" height="100" rx="4" fill="url(#spectrumRed)"/>
      <rect x="234" y="40" width="10" height="80" rx="4" fill="url(#spectrumRed)"/>
      <rect x="252" y="65" width="10" height="55" rx="4" fill="url(#spectrumRed)"/>
    </g>

    <!-- Track metadata -->
    <text x="165" y="185" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="800" text-anchor="middle">SYNTHWAVE HORIZON</text>
    <text x="165" y="205" fill="#8e92a0" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" text-anchor="middle">ARVIND AUDIO SUITE • 320 KBPS</text>

    <!-- Progress Timeline Bar -->
    <g transform="translate(35, 225)">
      <rect x="0" y="0" width="260" height="4" rx="2" fill="#252733"/>
      <rect x="0" y="0" width="165" height="4" rx="2" fill="#e50920"/>
      <circle cx="165" cy="2" r="6" fill="#ffffff"/>
      <text x="0" y="20" fill="#8e92a0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9">2:14</text>
      <text x="240" y="20" fill="#8e92a0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9">3:48</text>
    </g>

    <!-- Playback controls -->
    <g transform="translate(165, 280)">
      <!-- Previous -->
      <polygon points="-55,-8 -40,0 -40,-8 -25,0 -25,8 -40,0 -40,8 -55,0" fill="#8e92a0"/>
      <!-- Play/Pause circle -->
      <circle cx="0" cy="0" r="18" fill="#e50920"/>
      <polygon points="-4,-7 8,0 -4,7" fill="#ffffff"/>
      <!-- Next -->
      <polygon points="25,-8 40,0 40,-8 55,0 55,8 40,0 40,8 25,0" fill="#8e92a0"/>
    </g>
  </g>
</svg>