<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="yhackBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090a0d"/>
      <stop offset="100%" stop-color="#141118"/>
    </linearGradient>
    <filter id="yhackGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#e50920" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#yhackBg)"/>

  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="125" x2="800" y2="125"/>
    <line x1="0" y1="250" x2="800" y2="250"/>
    <line x1="0" y1="375" x2="800" y2="375"/>
    <line x1="266" y1="0" x2="266" y2="500"/>
    <line x1="533" y1="0" x2="533" y2="500"/>
  </g>

  <!-- Left Info -->
  <text x="50" y="55" fill="#e50920" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" letter-spacing="3">HACKATHON INNOVATION</text>
  <text x="230" y="55" fill="#666675" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" letter-spacing="2">• COLLABORATIVE ENGINEERING</text>
  <line x1="50" y1="75" x2="750" y2="75" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>

  <text x="50" y="145" fill="#ffffff" font-family="'Bebas Neue', sans-serif" font-size="52" font-weight="900" letter-spacing="2">YHACK26 LASTMINUTE</text>
  <text x="50" y="195" fill="#e50920" font-family="'Bebas Neue', sans-serif" font-size="52" font-weight="900" letter-spacing="2">RAPID PROTOTYPE</text>

  <text x="50" y="240" fill="#8e92a0" font-family="'Plus Jakarta Sans', sans-serif" font-size="13">High-intensity hackathon sprint build engineered for</text>
  <text x="50" y="262" fill="#8e92a0" font-family="'Plus Jakarta Sans', sans-serif" font-size="13">the YHACK competition. Built with full-stack agility,</text>
  <text x="50" y="284" fill="#8e92a0" font-family="'Plus Jakarta Sans', sans-serif" font-size="13">real-time synchronization, and modular micro-services.</text>

  <g transform="translate(50, 320)">
    <rect x="0" y="0" width="85" height="26" rx="4" fill="#181a22" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="42" y="17" fill="#e4e4e7" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" text-anchor="middle">HACKATHON</text>

    <rect x="95" y="0" width="85" height="26" rx="4" fill="#181a22" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="137" y="17" fill="#e4e4e7" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" text-anchor="middle">FULL-STACK</text>

    <rect x="190" y="0" width="75" height="26" rx="4" fill="#181a22" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="227" y="17" fill="#e4e4e7" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" text-anchor="middle">GITHUB</text>
  </g>

  <!-- Right Visual: Hackathon Terminal/IDE Card -->
  <g transform="translate(430, 105)" filter="url(#yhackGlow)">
    <rect x="0" y="0" width="330" height="330" rx="16" fill="#101118" stroke="#e50920" stroke-opacity="0.4" stroke-width="1.5"/>

    <rect x="0" y="0" width="330" height="40" rx="16" fill="#171822"/>
    <circle cx="20" cy="20" r="4.5" fill="#e50920"/>
    <circle cx="35" cy="20" r="4.5" fill="#f59e0b"/>
    <circle cx="50" cy="20" r="4.5" fill="#10b981"/>
    <text x="165" y="24" fill="#8e92a0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" text-anchor="middle">YHACK26_YS532_LastMinute</text>

    <!-- Code Editor Mockup -->
    <g transform="translate(20, 60)" font-family="monospace" font-size="11">
      <text x="0" y="20" fill="#e50920">import</text>
      <text x="50" y="20" fill="#ffffff">{ initializeService } from 'core';</text>

      <text x="0" y="45" fill="#8e92a0">// YHACK Sprint Engine</text>

      <text x="0" y="70" fill="#e50920">export const</text>
      <text x="90" y="70" fill="#ffffff">SprintApp = () =&gt; {</text>

      <text x="15" y="95" fill="#10b981">const [latency, setLat] = useTime();</text>

      <text x="15" y="120" fill="#f59e0b">dispatchSync({ status: 'DEPLOYED' });</text>

      <text x="15" y="145" fill="#ffffff">return &lt;UI status="LIVE" /&gt;;</text>
      <text x="0" y="170" fill="#ffffff">};</text>
    </g>

    <!-- Sprint badge -->
    <g transform="translate(20, 260)">
      <rect x="0" y="0" width="290" height="45" rx="8" fill="#090a0e" stroke="#ffffff" stroke-opacity="0.08"/>
      <text x="20" y="28" fill="#10b981" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800">● 100% SPRINT COMMITTED</text>
      <text x="210" y="28" fill="#8e92a0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700">TEAM YS532</text>
    </g>
  </g>
</svg>