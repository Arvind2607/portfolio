<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="fashionBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f12"/>
      <stop offset="100%" stop-color="#1d1214"/>
    </linearGradient>
    <radialGradient id="redAura" cx="70%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#c9141d" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0f0f12" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="dressRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2a34"/>
      <stop offset="50%" stop-color="#d9141d"/>
      <stop offset="100%" stop-color="#73050b"/>
    </linearGradient>
    <filter id="modelGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="15" stdDeviation="25" flood-color="#c9141d" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Deep Dark Background -->
  <rect width="800" height="500" fill="url(#fashionBg)"/>
  <circle cx="580" cy="250" r="300" fill="url(#redAura)"/>

  <!-- Editorial Top Bar -->
  <text x="60" y="55" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="900" letter-spacing="6">URBANIC</text>
  <text x="210" y="55" fill="#a02028" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" letter-spacing="3">ISSUE VOL. 28</text>
  <text x="680" y="55" fill="#888c99" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" letter-spacing="2">ARCHIVE</text>
  <line x1="60" y1="75" x2="740" y2="75" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>

  <!-- Left Editorial Typography -->
  <text x="60" y="150" fill="#e51b24" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" letter-spacing="4">AUTUMN / WINTER 2026</text>
  <text x="60" y="210" fill="#ffffff" font-family="'Bebas Neue', 'Oswald', sans-serif" font-size="58" font-weight="900" letter-spacing="2">STAY</text>
  <text x="60" y="265" fill="#ffffff" font-family="'Bebas Neue', 'Oswald', sans-serif" font-size="58" font-weight="900" letter-spacing="2">AHEAD</text>
  <text x="60" y="320" fill="#ffffff" font-family="'Bebas Neue', 'Oswald', sans-serif" font-size="58" font-weight="900" letter-spacing="2">IN STYLE</text>

  <text x="60" y="375" fill="#9496a1" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="400">Discover avant-garde tailoring and future-forward</text>
  <text x="60" y="398" fill="#9496a1" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="400">silhouettes curated for the modern metropolis.</text>

  <rect x="60" y="430" width="160" height="38" rx="19" fill="#e51b24"/>
  <text x="140" y="454" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" text-anchor="middle" letter-spacing="1">READ EDITORIAL →</text>

  <!-- Right Fashion Model Vector Silhouette / Portrait -->
  <g transform="translate(460, 60)" filter="url(#modelGlow)">
    <!-- Red Haute Couture Dress & Silhouette -->
    <!-- Head & Hair -->
    <path d="M 140 100 Q 155 45 190 70 Q 210 100 205 140 Q 195 160 170 160 Q 140 155 140 100 Z" fill="#151214"/>
    <!-- Elegant Face Profile -->
    <path d="M 155 90 Q 170 85 180 95 Q 185 125 170 145 Q 155 145 150 120 Z" fill="#e8b99e"/>
    <!-- Cheek contour & lips -->
    <path d="M 160 125 Q 166 128 172 125" stroke="#a31620" stroke-width="3" stroke-linecap="round"/>

    <!-- Dramatic Crimson Sleeves and Bodice -->
    <path d="M 120 180 Q 90 220 70 320 Q 110 330 140 280 Q 150 210 150 180 Z" fill="url(#dressRed)"/>
    <path d="M 190 180 Q 230 220 260 320 Q 220 330 190 270 Q 180 210 180 180 Z" fill="url(#dressRed)"/>
    <path d="M 145 175 Q 165 170 185 175 Q 195 240 190 320 Q 165 330 140 320 Q 135 240 145 175 Z" fill="#c0121a"/>

    <!-- Flowing Gown skirt -->
    <path d="M 70 320 Q 165 300 260 320 L 290 420 Q 165 440 40 420 Z" fill="url(#dressRed)"/>
    <!-- Gown folds and highlights -->
    <path d="M 120 320 Q 110 380 90 420" stroke="#ff4d55" stroke-width="2" opacity="0.6"/>
    <path d="M 170 320 Q 170 380 165 430" stroke="#ff4d55" stroke-width="3" opacity="0.7"/>
    <path d="M 210 320 Q 220 380 240 420" stroke="#ff4d55" stroke-width="2" opacity="0.6"/>
  </g>

  <!-- Tag Pill -->
  <rect x="680" y="430" width="60" height="26" rx="13" fill="#20222a" stroke="rgba(255,255,255,0.1)"/>
  <text x="710" y="447" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" text-anchor="middle">FW26</text>
</svg>
