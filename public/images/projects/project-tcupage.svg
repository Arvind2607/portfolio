<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="tcuBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08090d"/>
      <stop offset="100%" stop-color="#12141d"/>
    </linearGradient>
    <filter id="tcuGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#e50920" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#tcuBg)"/>

  <!-- Grid lines -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="125" x2="800" y2="125"/>
    <line x1="0" y1="250" x2="800" y2="250"/>
    <line x1="0" y1="375" x2="800" y2="375"/>
    <line x1="266" y1="0" x2="266" y2="500"/>
    <line x1="533" y1="0" x2="533" y2="500"/>
  </g>

  <!-- Left Header & Info -->
  <text x="50" y="55" fill="#e50920" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" letter-spacing="3">VEHICLE TELEMATICS CONTROL</text>
  <text x="260" y="55" fill="#666675" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" letter-spacing="2">• TCU TELEMETRY CONSOLE</text>
  <line x1="50" y1="75" x2="750" y2="75" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>

  <text x="50" y="145" fill="#ffffff" font-family="'Bebas Neue', sans-serif" font-size="52" font-weight="900" letter-spacing="2">TCU DASHBOARD</text>
  <text x="50" y="195" fill="#e50920" font-family="'Bebas Neue', sans-serif" font-size="52" font-weight="900" letter-spacing="2">&amp; TELEMATICS PAGE</text>

  <text x="50" y="240" fill="#8e92a0" font-family="'Plus Jakarta Sans', sans-serif" font-size="13">In-vehicle Telematics Control Unit (TCU) monitoring suite.</text>
  <text x="50" y="262" fill="#8e92a0" font-family="'Plus Jakarta Sans', sans-serif" font-size="13">Aggregates real-time CAN bus telemetry, cellular 4G/LTE</text>
  <text x="50" y="284" fill="#8e92a0" font-family="'Plus Jakarta Sans', sans-serif" font-size="13">link status, GPS geofencing, and vehicle diagnostics.</text>

  <!-- Tags -->
  <g transform="translate(50, 320)">
    <rect x="0" y="0" width="102" height="26" rx="4" fill="#181a22" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="51" y="17" fill="#e4e4e7" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" text-anchor="middle">AUTOMOTIVE TCU</text>

    <rect x="112" y="0" width="82" height="26" rx="4" fill="#181a22" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="153" y="17" fill="#e4e4e7" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" text-anchor="middle">TELEMETRY</text>

    <rect x="204" y="0" width="75" height="26" rx="4" fill="#181a22" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="241" y="17" fill="#e4e4e7" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" text-anchor="middle">WEB UI</text>
  </g>

  <!-- Right Visual: TCU Console Card -->
  <g transform="translate(420, 105)" filter="url(#tcuGlow)">
    <rect x="0" y="0" width="340" height="340" rx="16" fill="#111219" stroke="#e50920" stroke-opacity="0.4" stroke-width="1.5"/>

    <!-- Header bar -->
    <rect x="0" y="0" width="340" height="42" rx="16" fill="#181a24"/>
    <text x="20" y="26" fill="#e50920" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800">TCU-NODE // VIN: AMR-2026-X</text>
    <circle cx="315" cy="21" r="5" fill="#10b981"/>

    <!-- Telemetry dials -->
    <g transform="translate(20, 60)">
      <!-- Speed / RPM block -->
      <rect x="0" y="0" width="140" height="110" rx="10" fill="#0c0d13" stroke="#ffffff" stroke-opacity="0.08"/>
      <text x="15" y="25" fill="#8e92a0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700">CAN SPEED</text>
      <text x="15" y="70" fill="#ffffff" font-family="'Bebas Neue', sans-serif" font-size="44" font-weight="900">112</text>
      <text x="80" y="65" fill="#e50920" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800">KM/H</text>

      <!-- Cellular / GPS block -->
      <rect x="160" y="0" width="140" height="110" rx="10" fill="#0c0d13" stroke="#ffffff" stroke-opacity="0.08"/>
      <text x="175" y="25" fill="#8e92a0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700">UPLINK RATE</text>
      <text x="175" y="70" fill="#10b981" font-family="'Bebas Neue', sans-serif" font-size="44" font-weight="900">4G</text>
      <text x="225" y="65" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800">LTE-M</text>
    </g>

    <!-- Waveform / CAN packet stream -->
    <g transform="translate(20, 190)">
      <rect x="0" y="0" width="300" height="125" rx="10" fill="#0a0a0f" stroke="#ffffff" stroke-opacity="0.06"/>
      <text x="15" y="24" fill="#8e92a0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700">CAN-FD BUS STREAM (0x1A4, 0x2B8, 0x3F0)</text>

      <path d="M 15 80 L 50 80 L 65 40 L 80 100 L 95 60 L 120 60 L 135 30 L 150 90 L 175 70 L 210 70 L 225 45 L 240 85 L 285 85" fill="none" stroke="#e50920" stroke-width="2.5"/>
    </g>
  </g>
</svg>