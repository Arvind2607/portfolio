<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="kioskBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0d"/>
      <stop offset="100%" stop-color="#141117"/>
    </linearGradient>
    <filter id="kioskGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#e50920" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#kioskBg)"/>

  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="125" x2="800" y2="125"/>
    <line x1="0" y1="250" x2="800" y2="250"/>
    <line x1="0" y1="375" x2="800" y2="375"/>
    <line x1="266" y1="0" x2="266" y2="500"/>
    <line x1="533" y1="0" x2="533" y2="500"/>
  </g>

  <!-- Left Info -->
  <text x="50" y="55" fill="#e50920" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" letter-spacing="3">FUNCTIONAL ARCHITECTURE</text>
  <text x="250" y="55" fill="#666675" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" letter-spacing="2">• HASKELL STATE MONAD</text>
  <line x1="50" y1="75" x2="750" y2="75" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>

  <text x="50" y="145" fill="#ffffff" font-family="'Bebas Neue', sans-serif" font-size="52" font-weight="900" letter-spacing="2">SELF ORDERING KIOSK</text>
  <text x="50" y="195" fill="#e50920" font-family="'Bebas Neue', sans-serif" font-size="52" font-weight="900" letter-spacing="2">HASKELL POS ENGINE</text>

  <text x="50" y="240" fill="#8e92a0" font-family="'Plus Jakarta Sans', sans-serif" font-size="13">A purely functional self-ordering kiosk terminal system.</text>
  <text x="50" y="262" fill="#8e92a0" font-family="'Plus Jakarta Sans', sans-serif" font-size="13">Implemented in Haskell using immutable state transformations,</text>
  <text x="50" y="284" fill="#8e92a0" font-family="'Plus Jakarta Sans', sans-serif" font-size="13">algebraic data types for catalog items, and receipt dispatch.</text>

  <g transform="translate(50, 320)">
    <rect x="0" y="0" width="85" height="26" rx="4" fill="#181a22" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="42" y="17" fill="#e4e4e7" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" text-anchor="middle">HASKELL (λ)</text>

    <rect x="95" y="0" width="112" height="26" rx="4" fill="#181a22" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="151" y="17" fill="#e4e4e7" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" text-anchor="middle">FUNCTIONAL POS</text>

    <rect x="217" y="0" width="80" height="26" rx="4" fill="#181a22" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="257" y="17" fill="#e4e4e7" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" text-anchor="middle">KIOSK UI</text>
  </g>

  <!-- Right Visual: Kiosk Screen & Haskell Lambda Motif -->
  <g transform="translate(430, 105)" filter="url(#kioskGlow)">
    <rect x="0" y="0" width="330" height="330" rx="16" fill="#111218" stroke="#e50920" stroke-opacity="0.4" stroke-width="1.5"/>

    <!-- Kiosk header -->
    <rect x="0" y="0" width="330" height="42" rx="16" fill="#181a22"/>
    <text x="20" y="26" fill="#e50920" font-family="'Bebas Neue', sans-serif" font-size="18" font-weight="900" letter-spacing="2">HASKELL KIOSK TERMINAL</text>
    <text x="280" y="27" fill="#ffffff" font-family="monospace" font-size="16" font-weight="bold">λ</text>

    <!-- Catalog Menu Grid in Kiosk -->
    <g transform="translate(20, 60)">
      <rect x="0" y="0" width="135" height="110" rx="8" fill="#171822" stroke="#ffffff" stroke-opacity="0.08"/>
      <rect x="15" y="15" width="40" height="40" rx="6" fill="#e50920" opacity="0.8"/>
      <text x="15" y="75" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700">COMBO MEAL A</text>
      <text x="15" y="92" fill="#e50920" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="800">$12.50 [ADD]</text>

      <rect x="155" y="0" width="135" height="110" rx="8" fill="#171822" stroke="#ffffff" stroke-opacity="0.08"/>
      <rect x="170" y="15" width="40" height="40" rx="6" fill="#202230"/>
      <text x="170" y="75" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700">BEVERAGE SET</text>
      <text x="170" y="92" fill="#e50920" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="800">$4.00 [ADD]</text>
    </g>

    <!-- Cart Summary Bar -->
    <g transform="translate(20, 190)">
      <rect x="0" y="0" width="290" height="120" rx="10" fill="#090a0e" stroke="#ffffff" stroke-opacity="0.06"/>
      <text x="15" y="26" fill="#8e92a0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700">CURRENT CART (IMMUTABLE STATE)</text>
      
      <text x="15" y="55" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">2x Items Selected</text>
      <text x="210" y="55" fill="#10b981" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800">$16.50</text>

      <rect x="15" y="72" width="260" height="34" rx="17" fill="#e50920"/>
      <text x="145" y="93" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" text-anchor="middle" letter-spacing="1">COMPLETE ORDER (λ-DISPATCH) →</text>
    </g>
  </g>
</svg>