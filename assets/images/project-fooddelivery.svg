<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0c"/>
      <stop offset="100%" stop-color="#141419"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2a34"/>
      <stop offset="100%" stop-color="#c9141d"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1c24"/>
      <stop offset="100%" stop-color="#0f1015"/>
    </linearGradient>
    <filter id="crimsonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#e50920" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad)"/>

  <!-- Subtle grid lines -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/>
  </g>

  <!-- Ambient Glow -->
  <circle cx="580" cy="240" r="220" fill="#e50920" opacity="0.12" filter="blur(60px)"/>

  <!-- Left Editorial Typography -->
  <text x="50" y="55" fill="#e50920" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" letter-spacing="3">MACHINE LEARNING APP</text>
  <text x="235" y="55" fill="#666675" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" letter-spacing="2">• REAL-TIME INFERENCE</text>
  <line x1="50" y1="75" x2="750" y2="75" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>

  <text x="50" y="145" fill="#ffffff" font-family="'Bebas Neue', sans-serif" font-size="52" font-weight="900" letter-spacing="2">FOOD DELIVERY</text>
  <text x="50" y="195" fill="#e50920" font-family="'Bebas Neue', sans-serif" font-size="52" font-weight="900" letter-spacing="2">TIME PREDICTOR</text>

  <text x="50" y="240" fill="#8e92a0" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="400">Deployed machine learning regression model</text>
  <text x="50" y="262" fill="#8e92a0" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="400">predicting delivery ETA using weather, traffic,</text>
  <text x="50" y="284" fill="#8e92a0" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="400">order quantity, and courier distance metrics.</text>

  <!-- Tags -->
  <g transform="translate(50, 320)">
    <rect x="0" y="0" width="82" height="26" rx="4" fill="#181a22" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="41" y="17" fill="#e4e4e7" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" text-anchor="middle">PYTHON</text>

    <rect x="92" y="0" width="98" height="26" rx="4" fill="#181a22" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="141" y="17" fill="#e4e4e7" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" text-anchor="middle">ML MODELS</text>

    <rect x="200" y="0" width="76" height="26" rx="4" fill="#181a22" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="238" y="17" fill="#e4e4e7" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" text-anchor="middle">VERCEL</text>
  </g>

  <!-- Live Link Button in SVG -->
  <g transform="translate(50, 390)">
    <rect x="0" y="0" width="220" height="42" rx="21" fill="url(#redGrad)" filter="url(#crimsonGlow)"/>
    <text x="110" y="26" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" text-anchor="middle" letter-spacing="1">LIVE DEMO AVAILABLE →</text>
  </g>

  <!-- Right Visual: Dashboard & Route Telemetry Card -->
  <g transform="translate(420, 105)" filter="url(#crimsonGlow)">
    <!-- Dashboard Card Container -->
    <rect x="0" y="0" width="340" height="340" rx="16" fill="url(#cardGrad)" stroke="#e50920" stroke-opacity="0.3" stroke-width="1.5"/>

    <!-- Header bar -->
    <rect x="0" y="0" width="340" height="44" rx="16" fill="#14151c"/>
    <circle cx="24" cy="22" r="5" fill="#e50920"/>
    <circle cx="40" cy="22" r="5" fill="#f59e0b"/>
    <circle cx="56" cy="22" r="5" fill="#10b981"/>
    <text x="170" y="26" fill="#8e92a0" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" text-anchor="middle">food-rosy-nu.vercel.app</text>

    <!-- ETA Big Number Box -->
    <rect x="24" y="64" width="292" height="88" rx="10" fill="#0c0d12" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="44" y="92" fill="#8e92a0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" letter-spacing="1">PREDICTED DELIVERY TIME</text>
    <text x="44" y="134" fill="#e50920" font-family="'Bebas Neue', sans-serif" font-size="44" font-weight="900">24.8 MINS</text>
    <text x="210" y="128" fill="#10b981" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700">± 1.2m error</text>

    <!-- Simulated Map / Route Graph -->
    <rect x="24" y="168" width="292" height="144" rx="10" fill="#0a0b0e" stroke="#ffffff" stroke-opacity="0.06"/>
    
    <!-- Path Line -->
    <path d="M 50 280 C 80 230, 110 260, 150 210 C 190 190, 220 240, 270 190" fill="none" stroke="#222530" stroke-width="4"/>
    <path d="M 50 280 C 80 230, 110 260, 150 210 C 190 190, 220 240, 270 190" fill="none" stroke="#e50920" stroke-width="2" stroke-dasharray="6,4"/>

    <!-- Route Points -->
    <circle cx="50" cy="280" r="7" fill="#e50920"/>
    <circle cx="50" cy="280" r="14" fill="#e50920" opacity="0.3"/>
    <text x="50" y="302" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" text-anchor="middle">RESTAURANT</text>

    <circle cx="270" cy="190" r="7" fill="#10b981"/>
    <circle cx="270" cy="190" r="14" fill="#10b981" opacity="0.3"/>
    <text x="270" y="176" fill="#10b981" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" text-anchor="middle">DESTINATION</text>
  </g>
</svg>