<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="evBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0d"/>
      <stop offset="100%" stop-color="#12141a"/>
    </linearGradient>
    <linearGradient id="evRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e51b24"/>
      <stop offset="100%" stop-color="#ff3b30"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#evBg)"/>

  <!-- Top bar -->
  <text x="60" y="55" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="900" letter-spacing="4">VOLTIX EV POWERTRAIN</text>
  <text x="320" y="55" fill="#8e92a0" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" letter-spacing="2">DUAL-MOTOR VECTORING ARCHITECTURE</text>
  <line x1="60" y1="75" x2="740" y2="75" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <!-- Car Chassis Silhouette -->
  <g transform="translate(180, 100)">
    <!-- Chassis perimeter -->
    <path d="M 60 50 Q 220 30 380 50 Q 430 110 430 220 Q 380 280 60 280 Q 10 220 10 110 Z" fill="#0f1117" stroke="#252936" stroke-width="2"/>
    
    <!-- Front Motor (Dual Inverter) -->
    <rect x="70" y="90" width="60" height="90" rx="6" fill="#1b1e2a" stroke="#e51b24" stroke-width="2"/>
    <text x="100" y="142" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="800" text-anchor="middle">FRONT</text>
    <text x="100" y="156" fill="#e51b24" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" text-anchor="middle">210 kW</text>

    <!-- Battery Pack in Floor -->
    <rect x="150" y="70" width="140" height="130" rx="8" fill="#141722" stroke="rgba(255,255,255,0.1)"/>
    <text x="220" y="125" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" text-anchor="middle">85 kWh PACK</text>
    <text x="220" y="145" fill="#10b981" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" text-anchor="middle">800V ARCHITECTURE</text>
    <text x="220" y="165" fill="#8e92a0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" text-anchor="middle">94.2% Eff.</text>

    <!-- Rear Motor (High-torque Vectoring) -->
    <rect x="310" y="80" width="70" height="110" rx="6" fill="#1b1e2a" stroke="#e51b24" stroke-width="2"/>
    <text x="345" y="135" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="800" text-anchor="middle">REAR</text>
    <text x="345" y="150" fill="#e51b24" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" text-anchor="middle">380 kW</text>

    <!-- Power bus lines -->
    <line x1="130" y1="135" x2="150" y2="135" stroke="#e51b24" stroke-width="4"/>
    <line x1="290" y1="135" x2="310" y2="135" stroke="#e51b24" stroke-width="4"/>
  </g>

  <!-- Left Stats Block -->
  <g transform="translate(60, 390)">
    <text x="0" y="0" fill="#8e92a0" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700">TOTAL SYSTEM OUTPUT</text>
    <text x="0" y="32" fill="#ffffff" font-family="'Bebas Neue', sans-serif" font-size="34">590 kW (791 HP)</text>
    <text x="0" y="52" fill="#e51b24" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700">0–100 km/h: 2.7s</text>
  </g>

  <!-- Right Stats Block -->
  <g transform="translate(480, 390)">
    <text x="0" y="0" fill="#8e92a0" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700">REGENERATIVE BRAKING HARVEST</text>
    <text x="0" y="32" fill="#ffffff" font-family="'Bebas Neue', sans-serif" font-size="34">MAX 320 kW REGEN</text>
    <text x="0" y="52" fill="#10b981" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700">+24% RANGE EXTENSION</text>
  </g>
</svg>
