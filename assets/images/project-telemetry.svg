<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="teleBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0b0e"/>
      <stop offset="100%" stop-color="#14161f"/>
    </linearGradient>
    <linearGradient id="redMeter" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e51b24"/>
      <stop offset="100%" stop-color="#ff453a"/>
    </linearGradient>
    <filter id="glowFilter" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#e51b24" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#teleBg)"/>

  <!-- Top bar -->
  <rect x="40" y="30" width="720" height="44" rx="8" fill="#12131a" stroke="rgba(255,255,255,0.08)"/>
  <circle cx="65" cy="52" r="5" fill="#e51b24"/>
  <circle cx="82" cy="52" r="5" fill="#f59e0b"/>
  <circle cx="99" cy="52" r="5" fill="#10b981"/>
  <text x="130" y="57" fill="#8e92a0" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" letter-spacing="2">APEX TELEMETRY OS // VEHICLE CAN-BUS BUS 01</text>
  <rect x="630" y="41" width="115" height="22" rx="11" fill="rgba(229,27,36,0.2)" stroke="#e51b24" stroke-width="1"/>
  <text x="687" y="56" fill="#ff453a" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="800" text-anchor="middle">LIVE 1000 HZ</text>

  <!-- Left Speedometer & RPM Gauges -->
  <g transform="translate(60, 110)">
    <!-- Speed Ring -->
    <circle cx="120" cy="120" r="90" fill="none" stroke="#1f222e" stroke-width="14"/>
    <path d="M 56 184 A 90 90 0 1 1 184 184" fill="none" stroke="url(#redMeter)" stroke-width="14" stroke-linecap="round"/>
    <text x="120" y="115" fill="#ffffff" font-family="'Bebas Neue', sans-serif" font-size="52" font-weight="900" text-anchor="middle">164</text>
    <text x="120" y="145" fill="#8e92a0" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" text-anchor="middle" letter-spacing="2">KM / H</text>
    <text x="120" y="170" fill="#e51b24" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="800" text-anchor="middle">GEAR 5 • 7,850 RPM</text>
  </g>

  <!-- Center Telemetry Graphs -->
  <g transform="translate(320, 105)">
    <rect x="0" y="0" width="440" height="160" rx="8" fill="#12141c" stroke="rgba(255,255,255,0.06)"/>
    <text x="20" y="28" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" letter-spacing="1">G-FORCE &amp; CHASSIS DYNAMICS</text>
    <text x="350" y="28" fill="#e51b24" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700">1.42 G LATERAL</text>
    
    <!-- Waveform / Telemetry Graph -->
    <path d="M 20 120 Q 70 60 120 100 T 220 50 T 320 110 T 420 70" fill="none" stroke="#e51b24" stroke-width="3" filter="url(#glowFilter)"/>
    <path d="M 20 130 Q 70 110 120 125 T 220 95 T 320 120 T 420 105" fill="none" stroke="#3b82f6" stroke-width="2" opacity="0.6"/>
  </g>

  <!-- Bottom Row: 3 Telemetry Data Cards -->
  <g transform="translate(60, 290)">
    <!-- Battery / Thermal -->
    <rect x="0" y="0" width="220" height="160" rx="8" fill="#12141c" stroke="rgba(255,255,255,0.06)"/>
    <text x="20" y="30" fill="#8e92a0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" letter-spacing="1">PACK THERMALS</text>
    <text x="20" y="65" fill="#ffffff" font-family="'Bebas Neue', sans-serif" font-size="36">38.4°C</text>
    <rect x="20" y="85" width="180" height="8" rx="4" fill="#202330"/>
    <rect x="20" y="85" width="130" height="8" rx="4" fill="#10b981"/>
    <text x="20" y="125" fill="#8e92a0" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Coolant flow: 14.2 L/min</text>
    <text x="20" y="142" fill="#10b981" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700">NOMINAL STATE</text>

    <!-- Throttle & Brake trace -->
    <rect x="240" y="0" width="220" height="160" rx="8" fill="#12141c" stroke="rgba(255,255,255,0.06)"/>
    <text x="260" y="30" fill="#8e92a0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" letter-spacing="1">PEDAL TELEMETRY</text>
    <text x="260" y="65" fill="#ffffff" font-family="'Bebas Neue', sans-serif" font-size="36">98% WOT</text>
    <rect x="260" y="85" width="180" height="8" rx="4" fill="#202330"/>
    <rect x="260" y="85" width="176" height="8" rx="4" fill="#e51b24"/>
    <text x="260" y="125" fill="#8e92a0" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Brake pressure: 0 Bar</text>
    <text x="260" y="142" fill="#e51b24" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700">FULL ACCELERATION</text>

    <!-- Lap Timer -->
    <rect x="480" y="0" width="220" height="160" rx="8" fill="#12141c" stroke="rgba(255,255,255,0.06)"/>
    <text x="500" y="30" fill="#8e92a0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" letter-spacing="1">CURRENT SECTOR</text>
    <text x="500" y="65" fill="#ffffff" font-family="'Bebas Neue', sans-serif" font-size="36">1:42.850</text>
    <text x="500" y="95" fill="#10b981" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800">-0.342s DELTA</text>
    <text x="500" y="125" fill="#8e92a0" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Circuit: Monza Virtual GP</text>
    <text x="500" y="142" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700">PERSONAL BEST</text>
  </g>
</svg>
