<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 480" width="100%" height="100%">
  <defs>
    <radialGradient id="deskGlow" cx="45%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e51b24" stop-opacity="0.32"/>
      <stop offset="60%" stop-color="#e51b24" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="laptopLid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f222b"/>
      <stop offset="100%" stop-color="#0f1014"/>
    </linearGradient>
    <linearGradient id="laptopScreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0b0d"/>
      <stop offset="100%" stop-color="#14151a"/>
    </linearGradient>
    <linearGradient id="baseGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a2d38"/>
      <stop offset="40%" stop-color="#191a21"/>
      <stop offset="100%" stop-color="#0c0d10"/>
    </linearGradient>
    <linearGradient id="mugGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1a1c22"/>
      <stop offset="50%" stop-color="#2c303c"/>
      <stop offset="100%" stop-color="#141519"/>
    </linearGradient>
    <filter id="laptopDropShadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="25" stdDeviation="22" flood-color="#000000" flood-opacity="0.9"/>
    </filter>
  </defs>

  <!-- Ambient red backlight aura on desk -->
  <ellipse cx="340" cy="240" rx="300" ry="200" fill="url(#deskGlow)"/>

  <!-- Coffee Mug (Left side of laptop) -->
  <g transform="translate(130, 290)" filter="url(#laptopDropShadow)">
    <!-- Mug Shadow -->
    <ellipse cx="40" cy="95" rx="35" ry="12" fill="#000000" opacity="0.6"/>
    <!-- Mug Handle -->
    <path d="M 12 25 C -15 25 -15 70 12 70" fill="none" stroke="#252731" stroke-width="8" stroke-linecap="round"/>
    <!-- Mug Body -->
    <rect x="10" y="10" width="60" height="80" rx="6" fill="url(#mugGrad)" stroke="#3a3d4d" stroke-width="1"/>
    <!-- Mug Top Rim -->
    <ellipse cx="40" cy="12" rx="30" ry="8" fill="#141519" stroke="#3a3d4d" stroke-width="1"/>
    <ellipse cx="40" cy="13" rx="27" ry="6" fill="#0d0e12"/>
    <!-- Coffee Surface -->
    <ellipse cx="40" cy="15" rx="24" ry="5" fill="#2b1a13"/>
    <!-- "ASB" monogram engraved in mug -->
    <text x="40" y="58" fill="#e51b24" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="900" text-anchor="middle">ASB</text>
  </g>

  <!-- Laptop Main Composition -->
  <g transform="translate(190, 50)" filter="url(#laptopDropShadow)">
    <!-- LAPTOP SCREEN / DISPLAY (Slight 3D perspective) -->
    <!-- Screen Bezel Outer Frame -->
    <polygon points="40,20 440,30 435,275 45,265" fill="url(#laptopLid)" stroke="#333745" stroke-width="1.5"/>

    <!-- Inner Screen Display -->
    <polygon points="55,35 425,43 421,253 59,245" fill="url(#laptopScreen)"/>

    <!-- Content rendered inside laptop display (Portfolio UI) -->
    <g transform="translate(25, 0)">
      <!-- Mini Browser Header -->
      <polygon points="35,38 395,45 395,58 35,51" fill="#181a20"/>
      <circle cx="48" cy="45" r="2.5" fill="#e51b24"/>
      <circle cx="56" cy="46" r="2.5" fill="#f59e0b"/>
      <circle cx="64" cy="47" r="2.5" fill="#10b981"/>

      <!-- Big Bold Red Text on Screen -->
      <text x="50" y="95" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" letter-spacing="1">ARVIND SB</text>
      <text x="50" y="112" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" letter-spacing="1">AUTOMOTIVE</text>
      <text x="50" y="128" fill="#e51b24" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="900" letter-spacing="2">SOFTWARE &amp; ADAS</text>
      <text x="50" y="144" fill="#8e92a0" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" font-weight="700" letter-spacing="1">AMRITA VISHWA VIDYAPEETHAM</text>

      <!-- Red Graphic Accent on screen -->
      <path d="M 230 70 L 260 70 L 290 120 L 260 120 Z" fill="#e51b24" opacity="0.9"/>
      <path d="M 275 70 L 305 70 L 335 120 L 305 120 Z" fill="#ffffff" opacity="0.15"/>

      <!-- Mini Project Cards on screen -->
      <rect x="50" y="165" width="85" height="55" rx="3" fill="#1a1c24" stroke="rgba(255,255,255,0.08)"/>
      <rect x="55" y="170" width="75" height="32" rx="2" fill="#242834"/>
      <line x1="55" y1="208" x2="105" y2="208" stroke="#ffffff" stroke-width="3"/>
      <line x1="55" y1="214" x2="85" y2="214" stroke="#e51b24" stroke-width="2"/>

      <rect x="145" y="165" width="85" height="55" rx="3" fill="#1a1c24" stroke="rgba(255,255,255,0.08)"/>
      <rect x="150" y="170" width="75" height="32" rx="2" fill="#242834"/>
      <line x1="150" y1="208" x2="200" y2="208" stroke="#ffffff" stroke-width="3"/>
      <line x1="150" y1="214" x2="180" y2="214" stroke="#e51b24" stroke-width="2"/>

      <rect x="240" y="165" width="85" height="55" rx="3" fill="#1a1c24" stroke="rgba(255,255,255,0.08)"/>
      <rect x="245" y="170" width="75" height="32" rx="2" fill="#242834"/>
      <line x1="245" y1="208" x2="295" y2="208" stroke="#ffffff" stroke-width="3"/>
      <line x1="245" y1="214" x2="275" y2="214" stroke="#e51b24" stroke-width="2"/>
    </g>

    <!-- LAPTOP BASE / KEYBOARD CHASSIS -->
    <!-- Base Top Surface -->
    <polygon points="45,265 435,275 480,365 0,355" fill="url(#baseGrad)" stroke="#3a3e4e" stroke-width="1"/>

    <!-- Keyboard Well Recess -->
    <polygon points="70,274 410,283 430,328 50,320" fill="#111217" stroke="#252733" stroke-width="1"/>

    <!-- Keyboard Keys Grid Lines (Simulated backlit keys) -->
    <g opacity="0.45" stroke="#3f4357" stroke-width="1">
      <line x1="68" y1="284" x2="412" y2="293"/>
      <line x1="63" y1="295" x2="417" y2="304"/>
      <line x1="58" y1="306" x2="422" y2="315"/>
      <line x1="53" y1="317" x2="427" y2="326"/>
    </g>

    <!-- Trackpad -->
    <polygon points="190,328 290,330 295,355 185,353" fill="#191b22" stroke="#2f3240" stroke-width="1"/>

    <!-- Base Front Lip Edge -->
    <polygon points="0,355 480,365 475,375 -5,365" fill="#0c0d10"/>
    <!-- Subtle front edge specular highlight -->
    <line x1="160" y1="358" x2="320" y2="361" stroke="#ffffff" stroke-width="1.2" opacity="0.4"/>
  </g>
</svg>
