<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="mapBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0d"/>
      <stop offset="100%" stop-color="#141419"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff263b"/>
      <stop offset="100%" stop-color="#c9141d"/>
    </linearGradient>
    <filter id="mapGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#e50920" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#mapBg)"/>

  <!-- Grid lines -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="125" x2="800" y2="125"/>
    <line x1="0" y1="250" x2="800" y2="250"/>
    <line x1="0" y1="375" x2="800" y2="375"/>
    <line x1="266" y1="0" x2="266" y2="500"/>
    <line x1="533" y1="0" x2="533" y2="500"/>
  </g>

  <!-- Left Header & Info -->
  <text x="50" y="55" fill="#e50920" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" letter-spacing="3">GEOSPATIAL &amp; ADAS ROUTING</text>
  <text x="260" y="55" fill="#666675" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" letter-spacing="2">• LIVE VERCEL DEPLOYMENT</text>
  <line x1="50" y1="75" x2="750" y2="75" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>

  <text x="50" y="145" fill="#ffffff" font-family="'Bebas Neue', sans-serif" font-size="52" font-weight="900" letter-spacing="2">SMARTMAP NAVIGATOR</text>
  <text x="50" y="195" fill="#e50920" font-family="'Bebas Neue', sans-serif" font-size="52" font-weight="900" letter-spacing="2">INTELLIGENT ROUTING</text>

  <text x="50" y="240" fill="#8e92a0" font-family="'Plus Jakarta Sans', sans-serif" font-size="13">Interactive vector mapping and routing application.</text>
  <text x="50" y="262" fill="#8e92a0" font-family="'Plus Jakarta Sans', sans-serif" font-size="13">Computes optimal pathfinding algorithms, live road telemetry,</text>
  <text x="50" y="284" fill="#8e92a0" font-family="'Plus Jakarta Sans', sans-serif" font-size="13">traffic density overlays, and destination waypoint ETA.</text>

  <!-- Tags -->
  <g transform="translate(50, 320)">
    <rect x="0" y="0" width="85" height="26" rx="4" fill="#181a22" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="42" y="17" fill="#e4e4e7" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" text-anchor="middle">MAPPING</text>

    <rect x="95" y="0" width="92" height="26" rx="4" fill="#181a22" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="141" y="17" fill="#e4e4e7" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" text-anchor="middle">PATHFINDING</text>

    <rect x="197" y="0" width="82" height="26" rx="4" fill="#181a22" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="238" y="17" fill="#e4e4e7" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" text-anchor="middle">VERCEL</text>
  </g>

  <!-- Live Link CTA in SVG -->
  <g transform="translate(50, 390)">
    <rect x="0" y="0" width="220" height="42" rx="21" fill="url(#redGrad)" filter="url(#mapGlow)"/>
    <text x="110" y="26" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" text-anchor="middle" letter-spacing="1">LIVE DEMO AVAILABLE →</text>
  </g>

  <!-- Right Visual: Navigation HUD Card -->
  <g transform="translate(430, 105)" filter="url(#mapGlow)">
    <rect x="0" y="0" width="330" height="330" rx="16" fill="#111219" stroke="#e50920" stroke-opacity="0.4" stroke-width="1.5"/>

    <!-- Browser URL header -->
    <rect x="0" y="0" width="330" height="34" rx="16" fill="#171822"/>
    <circle cx="20" cy="17" r="4" fill="#e50920"/>
    <circle cx="34" cy="17" r="4" fill="#f59e0b"/>
    <circle cx="48" cy="17" r="4" fill="#10b981"/>
    <text x="175" y="21" fill="#8e92a0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" text-anchor="middle">smartmap-navigator.vercel.app</text>

    <!-- Map Grid View -->
    <rect x="15" y="45" width="300" height="180" rx="10" fill="#090a0e" stroke="#ffffff" stroke-opacity="0.08"/>
    
    <!-- Road Map Network Lines -->
    <path d="M 30 190 L 100 130 L 180 150 L 250 80 L 290 60" fill="none" stroke="#252733" stroke-width="12" stroke-linecap="round"/>
    <path d="M 60 55 L 130 90 L 180 150 L 210 200" fill="none" stroke="#252733" stroke-width="10" stroke-linecap="round"/>

    <!-- Active Navigation Route in Crimson -->
    <path d="M 30 190 L 100 130 L 180 150 L 250 80 L 290 60" fill="none" stroke="#e50920" stroke-width="4" stroke-linecap="round"/>
    <path d="M 30 190 L 100 130 L 180 150 L 250 80 L 290 60" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="8,6"/>

    <!-- Start & Destination Pin -->
    <circle cx="30" cy="190" r="7" fill="#10b981"/>
    <circle cx="290" cy="60" r="8" fill="#e50920"/>
    <circle cx="290" cy="60" r="15" fill="#e50920" opacity="0.3"/>

    <!-- Navigation HUD Bottom Bar -->
    <g transform="translate(15, 235)">
      <rect x="0" y="0" width="300" height="80" rx="10" fill="#161720" stroke="#ffffff" stroke-opacity="0.08"/>
      <polygon points="25,40 45,25 45,35 60,35 60,45 45,45 45,55" fill="#e50920"/>
      <text x="75" y="38" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800">IN 350M TURN RIGHT</text>
      <text x="75" y="58" fill="#8e92a0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600">DISTANCE: 4.2 KM • ETA: 7 MINS</text>
    </g>
  </g>
</svg>