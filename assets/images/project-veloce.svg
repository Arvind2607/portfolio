<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0c"/>
      <stop offset="100%" stop-color="#14151b"/>
    </linearGradient>
    <linearGradient id="redGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e51b24" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ff3b30" stop-opacity="0.2"/>
    </linearGradient>
    <radialGradient id="bikeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e51b24" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow1" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad1)"/>
  
  <!-- Subtle grid pattern -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/>
  </g>

  <!-- Ambient bike glow -->
  <circle cx="540" cy="270" r="220" fill="url(#bikeGlow)"/>

  <!-- Top mock navigation bar -->
  <rect x="40" y="30" width="720" height="42" rx="8" fill="#111318" stroke="rgba(255,255,255,0.08)"/>
  <circle cx="65" cy="51" r="5" fill="#e51b24"/>
  <circle cx="82" cy="51" r="5" fill="#f59e0b"/>
  <circle cx="99" cy="51" r="5" fill="#10b981"/>
  <text x="130" y="56" fill="#888c99" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" letter-spacing="1">VELOCE CYCLES / PERFORMANCE SHOP</text>
  <rect x="640" y="40" width="100" height="22" rx="11" fill="#e51b24" opacity="0.9"/>
  <text x="690" y="55" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" text-anchor="middle">CART (1)</text>

  <!-- Left Content -->
  <text x="60" y="145" fill="#e51b24" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" letter-spacing="3">NEW 2026 ROAD EDITION</text>
  <text x="60" y="215" fill="#ffffff" font-family="'Bebas Neue', 'Oswald', sans-serif" font-size="64" font-weight="900" letter-spacing="2">VELOCE</text>
  <text x="60" y="260" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="28" font-weight="300" letter-spacing="6">BICYCLE</text>
  
  <text x="60" y="305" fill="#888c99" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="400">RIDE BEYOND LIMITS. ULTRA-LIGHT CARBON FIBER</text>
  <text x="60" y="325" fill="#888c99" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="400">AERODYNAMIC FRAME ENGINEERED FOR PURE SPEED.</text>

  <!-- Price & Button -->
  <text x="60" y="380" fill="#ffffff" font-family="'Bebas Neue', sans-serif" font-size="32" font-weight="900">$2,499</text>
  <rect x="160" y="352" width="140" height="38" rx="6" fill="#e51b24"/>
  <text x="230" y="376" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" text-anchor="middle" letter-spacing="1">ORDER NOW →</text>

  <!-- Bike Graphic Illustration -->
  <g transform="translate(360, 120)" filter="url(#shadow1)">
    <!-- Back Wheel -->
    <circle cx="80" cy="200" r="75" fill="none" stroke="#222530" stroke-width="12"/>
    <circle cx="80" cy="200" r="72" fill="none" stroke="#e51b24" stroke-width="2" stroke-dasharray="8 6"/>
    <circle cx="80" cy="200" r="14" fill="#3a3d4d"/>

    <!-- Front Wheel -->
    <circle cx="310" cy="200" r="75" fill="none" stroke="#222530" stroke-width="12"/>
    <circle cx="310" cy="200" r="72" fill="none" stroke="#e51b24" stroke-width="2" stroke-dasharray="8 6"/>
    <circle cx="310" cy="200" r="14" fill="#3a3d4d"/>

    <!-- Frame Geometry -->
    <!-- Rear chainstay -->
    <line x1="80" y1="200" x2="175" y2="200" stroke="#d41620" stroke-width="8" stroke-linecap="round"/>
    <!-- Seat stay -->
    <line x1="80" y1="200" x2="160" y2="105" stroke="#d41620" stroke-width="7" stroke-linecap="round"/>
    <!-- Seat tube -->
    <line x1="175" y1="200" x2="155" y2="85" stroke="#ffffff" stroke-width="9" stroke-linecap="round"/>
    <!-- Down tube -->
    <line x1="175" y1="200" x2="275" y2="100" stroke="#ffffff" stroke-width="11" stroke-linecap="round"/>
    <!-- Top tube -->
    <line x1="160" y1="105" x2="275" y2="100" stroke="#d41620" stroke-width="9" stroke-linecap="round"/>
    <!-- Front Fork -->
    <line x1="275" y1="100" x2="310" y2="200" stroke="#d41620" stroke-width="8" stroke-linecap="round"/>

    <!-- Handlebars -->
    <path d="M 275 100 L 275 80 L 295 75 Q 310 75 305 95" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
    <!-- Saddle -->
    <path d="M 135 80 Q 160 76 175 85" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round"/>

    <!-- Crankset -->
    <circle cx="175" cy="200" r="22" fill="none" stroke="#e51b24" stroke-width="5"/>
    <line x1="175" y1="200" x2="195" y2="215" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
    <rect x="190" y="213" width="14" height="6" rx="2" fill="#888c99"/>
  </g>
  
  <!-- Subtle badges -->
  <rect x="60" y="430" width="110" height="26" rx="13" fill="#181a20" stroke="rgba(255,255,255,0.1)"/>
  <text x="115" y="447" fill="#cccccc" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" text-anchor="middle">CARBON T800</text>
  
  <rect x="180" y="430" width="95" height="26" rx="13" fill="#181a20" stroke="rgba(255,255,255,0.1)"/>
  <text x="227" y="447" fill="#cccccc" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" text-anchor="middle">7.2 KG NET</text>
</svg>
